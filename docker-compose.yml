services:
  uke-flashcards:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uke-flashcards
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - uke-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/questions', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uke-flashcards.rule=Host(`uke.dev.kiszonka.com`)"
      - "traefik.http.routers.uke-flashcards.entrypoints=web"
      - "traefik.http.services.uke-flashcards.loadbalancer.server.port=3000"
    networks:
      - proxy_net

volumes:
  uke-data:
    driver: local

networks:
  proxy_net:
    external: true
